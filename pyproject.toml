[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splitst"
version = "0.1.0"
description = "Pure-Python SPLIT for spatial transcriptomics purification, AnnData-native and R-parity-audited."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "SPLIT Python Port" }
]
keywords = ["spatial transcriptomics", "SPLIT", "AnnData", "purification", "deconvolution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata>=0.9",
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "matplotlib>=3.6",
  "nbconvert>=7",
  "ipykernel>=6",
]

[project.urls]
Homepage = "https://github.com/omicverse/py-SPLIT"
Repository = "https://github.com/omicverse/py-SPLIT"
Issues = "https://github.com/omicverse/py-SPLIT/issues"

[tool.setuptools.packages.find]
include = ["splitst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
